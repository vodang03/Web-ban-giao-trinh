<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng nhập</title>
        <link rel="shortcut icon" type="image/png" href="./Image/logo.png">
        <link rel="stylesheet" href="./css/dangnhap.css">
    </head>
    <body>
        <header>
            <h2 class="logo">BookStore</h2>
            <nav class="navigation">
                <a class="btn-popup" href="./trangchu.html">Trang chủ</a>
                <a class="btn-popup" href="./sanpham.html">Sản phẩm</a>
            </nav>
        </header>
        <main class="wrapper__login">
            <div class="form-box login">
                <h2>Đăng nhập</h2>
                <form action="#">
                    <div class="input-box">
                        <span class="icon">
                            <ion-icon name="mail"></ion-icon>
                        </span>
                        <input type="mail" class="login-mail" required/>
                        <label>Email</label>
                        <p class="message"></p>
                    </div>
                    <div class="input-box">
                        <span class="icon">
                            <ion-icon name="lock-closed"></icon-icon>
                        </span>
                        <input type="password" class="login-password" required/>
                        <label>Mật khẩu</label>
                        <p class="message"></p>
                    </div>
                    <!--<div class="show-password">
                        <label><input type="checkbox"> Hiển thị mật khẩu</label>
                    </div>-->
                    <button type="submit" class="form-submit">Gửi</button>
                    <div class="login-signup">
                        <p>Bạn chưa có tài khoản? <a href="./dangky.html">Đăng ký</a></p>
                    </div>
                </form>
            </div>
        </main>
        <script src="./js/dangnhap.js"></script>
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    </body>
</html>
