<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng ký</title>
        <link rel="shortcut icon" type="image/png" href="./Image/logo.png">
        <link rel="stylesheet" href="./css/dangnhap.css">
    </head>
    <body>
        <header>
            <h2 class="logo">BookStore</h2>
            <nav class="navigation">
                <a class="btn-popup" href="./trangchu.html">Trang chủ</a>
                <a class="btn-popup" href="./sanpham.html">Sản phẩm</a>
            </nav>
        </header>
        <main class="wrapper__signup">
            <div class="form-box signup">
                <h2>Đăng ký</h2>
                <form action="#">
                    <div class="input-box">
                        <span class="icon">
                            <ion-icon name="person"></ion-icon>
                        </span>
                        <input type="username" class="signup-username" required/>
                        <label>Tên đăng nhập</label>
                        <p class="message"></p>
                    </div>
                    <div class="input-box">
                        <span class="icon">
                            <ion-icon name="mail"></icon-icon>
                        </span>
                        <input type="mail" class="signup-mail" required/>
                        <label>Email</label>
                        <p class="message"></p>
                    </div>
                    <div class="input-box">
                        <span class="icon">
                            <ion-icon name="lock-closed"></icon-icon>
                        </span>
                        <input type="password" class="signup-password" required/>
                        <label>Mật khẩu</label>
                        <p class="message"></p>
                    </div>
                    <!--<div class="show-password">
                        <label><input type="checkbox"> Hiển thị mật khẩu</label>
                    </div>-->
                    <button type="submit" class="form-submit">Gửi</button>
                    <div class="login-signup">
                        <p>Bạn đã có tài khoản? <a href="./dangnhap.html">Đăng nhập</a></p>
                    </div>
                </form>
            </div>
        </main>
        <script src="./js/dangky.js"></script>
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    </body>
</html>
